<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 370" width="612" height="370">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b0c"/>
      <stop offset="50%" stop-color="#121317"/>
      <stop offset="100%" stop-color="#0e1117"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#4d8aff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="612" height="370" rx="12" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Subtle glow -->
  <rect width="612" height="370" rx="12" fill="none" stroke="rgba(0,229,255,0.15)" stroke-width="1"/>

  <!-- Glow orb top-right -->
  <circle cx="520" cy="60" r="120" fill="rgba(0,229,255,0.04)" />

  <!-- Decorative line -->
  <line x1="35" y1="330" x2="577" y2="330" stroke="rgba(0,229,255,0.3)" stroke-width="1"/>

  <!-- Logo: AvIT Solutions -->
  <text x="35" y="58" font-family="'Inter', Arial, sans-serif" font-weight="800" font-size="20" fill="#ffffff" letter-spacing="-0.02em">A</text>
  <text x="52" y="58" font-family="'Inter', Arial, sans-serif" font-weight="500" font-size="20" fill="#ffffff" letter-spacing="-0.02em">v</text>
  <text x="66" y="58" font-family="'Inter', Arial, sans-serif" font-weight="800" font-size="20" fill="#FF3366" letter-spacing="-0.02em">I</text>
  <text x="78" y="58" font-family="'Inter', Arial, sans-serif" font-weight="800" font-size="20" fill="#ffffff" letter-spacing="-0.02em">T</text>
  <text x="94" y="58" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="20" fill="#00E5FF" letter-spacing="-0.02em">Solutions</text>

  <!-- Tagline -->
  <text x="35" y="100" font-family="'Inter', Arial, sans-serif" font-weight="400" font-size="10" fill="#6b7280" letter-spacing="1.5">
    AV INTEGRATIONS &amp; IT SOFTWARE APP DEVELOPMENT
  </text>

  <!-- Divider -->
  <line x1="35" y1="130" x2="200" y2="130" stroke="rgba(0,229,255,0.2)" stroke-width="1"/>

  <!-- Name -->
  <text x="35" y="165" font-family="'Inter', Arial, sans-serif" font-weight="800" font-size="24" fill="#ffffff" letter-spacing="-0.5">Tonny Gapam</text>

  <!-- Title -->
  <text x="35" y="190" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="12" fill="#00E5FF" letter-spacing="2">FOUNDER &amp; CEO</text>

  <!-- Contact -->
  <text x="35" y="225" font-family="'Inter', Arial, sans-serif" font-weight="500" font-size="10" fill="#a0a5b0">info@avitsolutions.tech</text>
  <text x="35" y="245" font-family="'Inter', Arial, sans-serif" font-weight="500" font-size="10" fill="#a0a5b0">support@avitsolutions.tech</text>
  <text x="35" y="265" font-family="'Inter', Arial, sans-serif" font-weight="500" font-size="10" fill="#a0a5b0">avitsolutions.tech</text>

  <!-- Domain on bottom right -->
  <text x="577" y="320" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="9" fill="#6b7280" text-anchor="end" letter-spacing="1">AVITSOLUTIONS.TECH</text>

  <!-- Corner accent dots -->
  <circle cx="577" cy="35" r="2" fill="rgba(0,229,255,0.4)"/>
  <circle cx="35" cy="320" r="2" fill="rgba(0,229,255,0.4)"/>
</svg>
