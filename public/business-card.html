<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AVIT Solutions — Business Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f5f3ee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Inter', -apple-system, sans-serif;
      padding: 2rem;
    }
    .card-container {
      position: relative;
      width: 612px;
      max-width: 100%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(25,22,18,0.12);
    }
    .card-container svg {
      display: block;
      width: 100%;
      height: auto;
    }
    .card-label {
      color: #484742;
      font-size: 0.8rem;
      margin-top: 1.5rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .instructions {
      color: #484742;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      text-align: center;
      line-height: 1.6;
    }
    .btn-group {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.5rem;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: #e32636;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #b51626;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: transparent;
      color: #111111;
      border: 1px solid #7a7770;
    }
    .btn-secondary:hover {
      background: #eeebe4;
      transform: translateY(-1px);
    }
    @media print {
      body { background: white; padding: 0; }
      .card-container {
        box-shadow: none;
        width: 3.5in;
        margin: 0.5in auto;
      }
      .card-label, .instructions, .btn-group { display: none; }
    }
    @media (max-width: 660px) {
      .card-container { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="card-container">
    <img src="/business-card.svg" alt="AVIT Solutions Business Card — Tonny Gapam, Founder & CEO" />
  </div>
  <p class="card-label">AVIT Solutions — Business Card</p>
  <p class="instructions">
    Tonny Gapam · Founder & CEO<br/>
    Print at 3.5" × 2.1" (standard business card size)
  </p>
  <div class="btn-group">
    <button class="btn btn-primary" onclick="window.print()">🖨️ Print Card</button>
    <a class="btn btn-secondary" href="/business-card.svg" download>⬇️ Download SVG</a>
  </div>
</body>
</html>
