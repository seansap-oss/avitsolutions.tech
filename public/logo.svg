<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 120" width="580" height="120">
  <defs>
    <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#4d8aff"/>
    </linearGradient>
  </defs>

  <!-- One continuous word: AviTSolutions -->
  <!-- A (white) -->
  <text x="0" y="58" font-family="'Inter','Segoe UI',Arial,sans-serif" font-weight="800" font-size="36" fill="#ffffff">A</text>
  <!-- v (white, lowercase) -->
  <text x="26" y="58" font-family="'Inter','Segoe UI',Arial,sans-serif" font-weight="500" font-size="36" fill="#ffffff">v</text>
  <!-- i (RED) -->
  <text x="44" y="58" font-family="'Inter','Segoe UI',Arial,sans-serif" font-weight="800" font-size="36" fill="#FF3366">i</text>
  <!-- T (white) -->
  <text x="56" y="58" font-family="'Inter','Segoe UI',Arial,sans-serif" font-weight="800" font-size="36" fill="#ffffff">T</text>
  <!-- Solutions (cyan) -->
  <text x="72" y="58" font-family="'Inter','Segoe UI',Arial,sans-serif" font-weight="600" font-size="36" fill="#00E5FF">Solutions</text>

  <!-- Tagline -->
  <text x="0" y="90" font-family="'Inter','Segoe UI',Arial,sans-serif" font-weight="400" font-size="11" fill="#9ca3af" letter-spacing="1">Complete AudioVisual &amp; IT Software</text>
  <text x="0" y="108" font-family="'Inter','Segoe UI',Arial,sans-serif" font-weight="400" font-size="11" fill="#9ca3af" letter-spacing="1">Mobile App Engineering &amp; Integration</text>
</svg>
