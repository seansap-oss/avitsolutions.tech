<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AviT Solutions AV and IT integration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#02040a"/>
      <stop offset="0.45" stop-color="#07152a"/>
      <stop offset="1" stop-color="#140728"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4bdfff"/>
      <stop offset="0.55" stop-color="#4b7bff"/>
      <stop offset="1" stop-color="#a46bff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#5fdfff" stroke-width="1">
    <path d="M60 160 C230 80 345 240 520 170 S850 80 1140 190" fill="none"/>
    <path d="M40 410 C260 300 390 490 590 390 S900 270 1160 420" fill="none"/>
    <path d="M130 90 L260 190 L420 130 L590 260 L760 170 L930 260 L1110 130" fill="none"/>
  </g>
  <g filter="url(#glow)">
    <rect x="735" y="150" width="330" height="210" rx="24" fill="#101826" stroke="#4bdfff" stroke-width="3"/>
    <path d="M760 340 L1040 340 L1110 485 L690 485 Z" fill="#07111f" stroke="#4b7bff" stroke-width="2"/>
    <rect x="778" y="188" width="244" height="130" rx="14" fill="url(#accent)" opacity="0.72"/>
    <circle cx="690" cy="270" r="42" fill="#0a1831" stroke="#4bdfff"/>
    <circle cx="1090" cy="270" r="42" fill="#0a1831" stroke="#a46bff"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <text x="88" y="98" fill="#f6fbff" font-size="34" font-weight="900">AviT<tspan fill="#4bdfff">Solutions</tspan></text>
