    <text x="92" y="410" fill="#95a4ba" font-size="24">Professional solutions for rooms, venues, businesses and digital products.</text>
    <rect x="88" y="470" width="250" height="56" rx="28" fill="url(#accent)"/>
    <text x="125" y="506" fill="#06101a" font-size="20" font-weight="900">Start Your Project</text>
