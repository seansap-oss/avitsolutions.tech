<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#5b3ed9"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2585"/>
      <stop offset="100%" stop-color="#2a1857"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b3ed9"/>
      <stop offset="100%" stop-color="#3a2585"/>
    </linearGradient>
  </defs>

  <!-- Top face -->
  <polygon points="20,4 36,12 20,20 4,12" fill="url(#topFace)" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Left face -->
  <polygon points="4,12 20,20 20,36 4,28" fill="url(#leftFace)" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Right face -->
  <polygon points="36,12 20,20 20,36 36,28" fill="url(#rightFace)" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Internal lines for cube segments -->
  <line x1="20" y1="20" x2="20" y2="36" stroke="#ffffff" stroke-width="0.5" opacity="0.4"/>
  <line x1="12" y1="16" x2="12" y2="32" stroke="#ffffff" stroke-width="0.5" opacity="0.4"/>
  <line x1="28" y1="16" x2="28" y2="32" stroke="#ffffff" stroke-width="0.5" opacity="0.4"/>
  <line x1="4" y1="12" x2="20" y2="20" stroke="#ffffff" stroke-width="0.5" opacity="0.4"/>
  <line x1="36" y1="12" x2="20" y2="20" stroke="#ffffff" stroke-width="0.5" opacity="0.4"/>
  <line x1="20" y1="4" x2="20" y2="20" stroke="#ffffff" stroke-width="0.5" opacity="0.4"/>
</svg>
